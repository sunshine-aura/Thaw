name: Local macOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned app
        run: |
          xcodebuild -project Thaw.xcodeproj \
            -scheme Thaw \
            -destination platform=macOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app artifact
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name 'Thaw.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Thaw.app not found"
            find build/DerivedData/Build/Products -maxdepth 3 -print
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" Thaw-1.2.0-local-thaw-unsigned.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thaw-1.2.0-local-thaw-unsigned
          path: Thaw-1.2.0-local-thaw-unsigned.zip
          if-no-files-found: error
